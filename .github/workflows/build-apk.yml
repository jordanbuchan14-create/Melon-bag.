name: Build Melon Bag APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          echo "Searching for Android project..."
          find . -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -n 1)")
          echo "Android project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Melon-Bag-APK
          path: "**/build/outputs/apk/debug/*.apk"
